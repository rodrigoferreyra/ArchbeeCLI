[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archbee-cli"
version = "0.1.0"
description = "Local CLI companion that analyzes Archbee documentation with Gemini against a user style guide."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ArchbeeCLI contributors" }]
dependencies = [
  "typer>=0.15.0",
  "httpx>=0.28.0",
  "google-genai>=1.0.0",
  "pydantic>=2.10.0",
  "rich>=13.9.0",
  "tomli-w>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-httpx>=0.35.0",
]

[project.scripts]
ArchbeeCLI = "archbee_cli.cli:app"
archbee-cli = "archbee_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/archbee_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
